<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caiden's Cross Library</title>
  <link rel="icon" type="image/png" href="/Caiden Cube Logo black.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #16161a; --bg2: #1e1e24; --bg3: #26262e;
      --border: rgba(255,255,255,0.08); --text: #f0f0f0; --muted: #8a8a9a;
      --accent: #7c6ff7;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; -webkit-font-smoothing: antialiased; min-height: 100vh; }

    body::before {
      content: '';
      position: fixed;
      top: -80px; left: 50%; transform: translateX(-50%);
      width: 600px; height: 300px;
      background: radial-gradient(ellipse, rgba(124,111,247,0.09) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
      animation: fadeIn 1s ease both;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .hero {
      padding: 3rem 2.5rem 2.5rem; text-align: center;
      position: relative; z-index: 1;
      animation: fadeUp 0.7s ease both;
    }
    .hero-lockup { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 14px; }
    .hero-logo { width: 56px; height: 56px; object-fit: contain; }
    .hero-cross-img { height: 56px; width: auto; object-fit: contain; }
    .hero-x { font-size: 22px; font-weight: 700; color: #3a3a52; }
    .hero-title { font-size: clamp(2rem, 4vw, 3rem); font-weight: 800; letter-spacing: -0.04em; color: var(--text); line-height: 1.1; }

    .categories {
      max-width: 480px; margin: 0 auto;
      padding: 0 24px 60px;
      display: flex; flex-direction: column; gap: 14px;
      animation: fadeUp 0.7s ease 0.3s both;
      position: relative; z-index: 1;
    }

    .cat-card {
      display: flex; align-items: center; justify-content: space-between;
      padding: 22px 28px;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 18px; text-decoration: none; color: var(--text);
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
    }
    .cat-card:hover { background: #232330; border-color: rgba(124,111,247,0.45); transform: translateY(-2px); }
    .cat-card:active { transform: scale(0.98); }

    .cat-info { display: flex; flex-direction: column; gap: 4px; }
    .cat-name { font-size: 16px; font-weight: 700; }
    .cat-count { font-size: 12px; color: var(--muted); font-weight: 500; }

    .cat-arrow { font-size: 20px; color: rgba(124,111,247,0.6); transition: color 0.15s, transform 0.15s; }
    .cat-card:hover .cat-arrow { color: var(--accent); transform: translateX(3px); }
  </style>
</head>
<body>
  <div class="hero">
    <div class="hero-lockup">
      <img class="hero-logo" src="/Caiden Cube Logo black.png" alt="Caiden Lee">
      <span class="hero-x">×</span>
      <img class="hero-cross-img" src="/cross-3x3.png" alt="Cross">
    </div>
    <h1 class="hero-title">Caiden's Cross Library</h1>
  </div>

  <div class="categories">
    <a href="/cross/tips/" class="cat-card">
      <div class="cat-info">
        <span class="cat-name">Tips</span>
        <span class="cat-count">3 videos</span>
      </div>
      <span class="cat-arrow">→</span>
    </a>
    <a href="/cross/boot-camp/" class="cat-card">
      <div class="cat-info">
        <span class="cat-name">Boot Camp</span>
        <span class="cat-count">2 videos</span>
      </div>
      <span class="cat-arrow">→</span>
    </a>
    <a href="/cross/advanced/" class="cat-card">
      <div class="cat-info">
        <span class="cat-name">Advanced</span>
        <span class="cat-count">2 videos</span>
      </div>
      <span class="cat-arrow">→</span>
    </a>
  </div>
</body>
</html>
