<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Fuel</title>

<!-- iOS Add to Home Screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fuel">
<meta name="theme-color" content="#0D0E11">
<link rel="apple-touch-icon" href="fuel-icon.png">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: #0D0E11; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    color: #F5F5F7;
    min-height: 100vh;
    padding: calc(env(safe-area-inset-top) + 26px) 18px calc(env(safe-area-inset-bottom) + 40px);
    user-select: none;
    -webkit-user-select: none;
  }
  .wrap { max-width: 460px; margin: 0 auto; }

  .apptitle { font-size: 36px; font-weight: 800; letter-spacing: -1px; margin-bottom: 24px; }
  .apptitle span { color: #FBBF24; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .tile {
    border-radius: 24px;
    min-height: 150px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 18px;
    cursor: pointer;
    transition: transform 0.12s ease;
    animation: gridIn 0.3s ease both;
  }
  .tile:active { transform: scale(0.94); }
  .tile.wide { grid-column: 1 / -1; min-height: 104px; }
  .tile .ticon { font-size: 34px; line-height: 1; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25)); }
  .tile .tname { font-size: 19px; font-weight: 800; color: #fff; letter-spacing: -0.3px; text-shadow: 0 1px 3px rgba(0,0,0,0.3); }

  .back { display: inline-flex; align-items: center; gap: 6px; color: #84848C; font-size: 16px; font-weight: 600; margin-bottom: 18px; cursor: pointer; }

  .hero {
    border-radius: 28px;
    padding: 26px 22px 24px;
    margin-bottom: 14px;
    animation: heroPop 0.42s cubic-bezier(0.34, 1.4, 0.5, 1) both;
  }
  .heroTop { display: flex; justify-content: space-between; align-items: flex-start; }
  .heroName { font-size: 30px; font-weight: 800; letter-spacing: -0.7px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.3); }
  .heroIcon { font-size: 40px; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.25)); display: inline-block; animation: iconBounce 0.55s cubic-bezier(0.34, 1.5, 0.5, 1) 0.08s both; }
  .heroLabel { font-size: 11px; letter-spacing: 2.5px; font-weight: 800; color: rgba(255,255,255,0.85); text-transform: uppercase; margin: 18px 0 8px; }
  .heroItem { font-size: 22px; font-weight: 800; color: #fff; line-height: 1.3; letter-spacing: -0.4px; text-shadow: 0 1px 3px rgba(0,0,0,0.25); }
  .heroItem + .heroItem { margin-top: 8px; }

  .squares { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .squares.single { grid-template-columns: 1fr; }
  .sq {
    border-radius: 24px;
    padding: 18px 18px 16px;
    min-height: 150px;
    display: flex;
    flex-direction: column;
    transition: transform 0.12s ease;
    animation: rise 0.4s cubic-bezier(0.2, 0.8, 0.3, 1) both;
  }
  .sq:active { transform: scale(0.95); }
  .sqLabel { font-size: 12px; letter-spacing: 2px; font-weight: 800; text-transform: uppercase; margin-bottom: 12px; }
  .sqItem { font-size: 17px; font-weight: 700; line-height: 1.35; letter-spacing: -0.2px; padding: 10px 0; }
  .sqItem:first-of-type { padding-top: 0; }
  .sqItem:last-of-type { padding-bottom: 0; }

  @keyframes heroPop {
    0% { opacity: 0; transform: scale(0.86) translateY(14px); }
    60% { opacity: 1; transform: scale(1.02) translateY(-2px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes rise {
    0% { opacity: 0; transform: translateY(24px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes iconBounce {
    0% { transform: scale(0.3) rotate(-12deg); opacity: 0; }
    55% { transform: scale(1.18) rotate(4deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  @keyframes gridIn {
    0% { opacity: 0; transform: scale(0.95); }
    100% { opacity: 1; transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .tile, .hero, .heroIcon, .sq { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const MEALS = [
  {
    name: "Breakfast", icon: "🍳", g: ["#FBBF24", "#D97706"], accent: "#FBBF24",
    main: ["3–4 eggs", "Oatmeal with whole milk, banana, honey + PB"],
    sides: ["Toast or bagel"], drink: ["Water"],
  },
  {
    name: "Morning Snack", icon: "🥜", g: ["#34D399", "#059669"], accent: "#34D399",
    main: ["Greek yogurt with granola"],
    sides: ["Fruit", "Trail mix or nuts"], drink: ["Water"],
  },
  {
    name: "Lunch", icon: "🍗", g: ["#60A5FA", "#2563EB"], accent: "#60A5FA",
    main: ["6–8 oz chicken, beef, turkey or pork"],
    sides: ["Rice, pasta or potatoes (big serving)", "Fruit or veggies"],
    drink: ["Milk or chocolate milk"],
  },
  {
    name: "Pre-Workout", icon: "⚡", g: ["#FB7185", "#E11D48"], accent: "#FB7185",
    main: ["Bagel with PB + honey"],
    sides: ["Banana or applesauce"], drink: ["Water with electrolytes"],
  },
  {
    name: "Post-Workout", icon: "💪", g: ["#A78BFA", "#7C3AED"], accent: "#A78BFA",
    main: ["PB&J sandwich"],
    sides: ["Banana or granola bar"], drink: ["Chocolate milk or recovery shake"],
  },
  {
    name: "Dinner", icon: "🍽️", g: ["#2DD4BF", "#0D9488"], accent: "#2DD4BF",
    main: ["6–8 oz of meat"],
    sides: ["Rice, pasta or potatoes (big serving)", "Veggies", "Bread or tortillas"],
    drink: ["Milk or water"],
  },
  {
    name: "Before Bed", icon: "🌙", g: ["#818CF8", "#4F46E5"], accent: "#818CF8",
    mainLabel: "Pick One",
    main: ["Greek yogurt + granola + honey", "Cottage cheese + fruit", "PB&J with milk"],
  },
];

const app = document.getElementById("app");

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

function renderHome() {
  app.innerHTML = `
    <div class="apptitle">Fuel<span>.</span></div>
    <div class="grid">
      ${MEALS.map((m, i) => `
        <div class="tile ${i === 6 ? "wide" : ""}" data-i="${i}"
             style="animation-delay:${i * 0.04}s;
                    background:linear-gradient(145deg, ${m.g[0]}, ${m.g[1]});
                    box-shadow:0 8px 24px -12px ${m.g[1]}66;">
          <div class="ticon">${m.icon}</div>
          <div class="tname">${esc(m.name)}</div>
        </div>
      `).join("")}
    </div>
  `;
  app.querySelectorAll(".tile").forEach((el) => {
    el.addEventListener("click", () => renderMeal(Number(el.dataset.i)));
  });
  window.scrollTo(0, 0);
}

function squareCard(label, items, accent, delay) {
  return `
    <div class="sq" style="animation-delay:${delay}s;
         background:linear-gradient(180deg, ${accent}1F, ${accent}0A), #17181C;
         border:1px solid ${accent}33;">
      <div class="sqLabel" style="color:${accent}">${label}</div>
      <div>
        ${items.map((it, i) => `
          <div class="sqItem" style="${i > 0 ? `border-top:1px solid ${accent}22;` : ""}">${esc(it)}</div>
        `).join("")}
      </div>
    </div>
  `;
}

function renderMeal(i) {
  const m = MEALS[i];
  const hasSquares = m.sides || m.drink;
  app.innerHTML = `
    <div class="back" id="back">‹ Back</div>
    <div class="hero" style="background:linear-gradient(155deg, ${m.g[0]}, ${m.g[1]});
         box-shadow:0 14px 38px -14px ${m.g[1]}99;">
      <div class="heroTop">
        <div class="heroName">${esc(m.name)}</div>
        <span class="heroIcon">${m.icon}</span>
      </div>
      <div class="heroLabel">${esc(m.mainLabel || "Main Course")}</div>
      ${m.main.map((it) => `<div class="heroItem">${esc(it)}</div>`).join("")}
    </div>
    ${hasSquares ? `
      <div class="squares ${m.sides && m.drink ? "" : "single"}">
        ${m.sides ? squareCard("Side Dishes", m.sides, m.accent, 0.12) : ""}
        ${m.drink ? squareCard("Drink", m.drink, m.accent, 0.18) : ""}
      </div>
    ` : ""}
  `;
  document.getElementById("back").addEventListener("click", renderHome);
  window.scrollTo(0, 0);
}

renderHome();
</script>
</body>
</html>
