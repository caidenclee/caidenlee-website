<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Days</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Days">
<meta name="theme-color" content="#0D0E11">
<link rel="apple-touch-icon" href="days-icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: #0D0E11; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    color: #F5F5F7; min-height: 100vh;
    padding: calc(env(safe-area-inset-top) + 26px) 18px calc(env(safe-area-inset-bottom) + 110px);
    user-select: none; -webkit-user-select: none;
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  .apptitle { font-size: 36px; font-weight: 800; letter-spacing: -1px; margin-bottom: 6px; }
  .apptitle span { color: #FBBF24; }
  .sub { color: #84848C; font-size: 15px; font-weight: 600; margin-bottom: 22px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile {
    border-radius: 24px; min-height: 150px; display: flex; flex-direction: column; justify-content: space-between;
    padding: 18px; cursor: pointer; transition: transform 0.12s ease; animation: gridIn 0.3s ease both; position: relative;
  }
  .tile:active { transform: scale(0.94); }
  .tile.wide { grid-column: 1 / -1; }
  .tile.big { min-height: 220px; }
  .tile .ticon { font-size: 34px; line-height: 1; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25)); }
  .tile.big .ticon { font-size: 48px; }
  .tile .tname { font-size: 19px; font-weight: 800; color: #fff; letter-spacing: -0.3px; text-shadow: 0 1px 3px rgba(0,0,0,0.3); }
  .tile.big .tname { font-size: 28px; letter-spacing: -0.6px; }
  .tile .tsub { font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.8); margin-top: 6px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .back { display: inline-flex; align-items: center; gap: 6px; color: #84848C; font-size: 16px; font-weight: 600; cursor: pointer; }
  .pill { color: #84848C; font-size: 14px; font-weight: 700; cursor: pointer; padding: 6px 12px; border-radius: 10px; background: #17181C; }
  .pill:active { transform: scale(0.95); }
  .pills { display: flex; gap: 8px; }
  .hero { border-radius: 28px; padding: 26px 22px 24px; margin-bottom: 14px; animation: heroPop 0.42s cubic-bezier(0.34, 1.4, 0.5, 1) both; }
  .heroTop { display: flex; justify-content: space-between; align-items: flex-start; }
  .heroName { font-size: 30px; font-weight: 800; letter-spacing: -0.7px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.3); }
  .heroIcon { font-size: 40px; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.25)); display: inline-block; animation: iconBounce 0.55s cubic-bezier(0.34, 1.5, 0.5, 1) 0.08s both; }
  .heroCount { font-size: 15px; font-weight: 700; color: rgba(255,255,255,0.85); margin-top: 10px; }
  .heroBar { height: 8px; border-radius: 999px; background: rgba(0,0,0,0.25); margin-top: 10px; overflow: hidden; }
  .heroFill { height: 100%; border-radius: 999px; background: #fff; transition: width 0.35s cubic-bezier(0.2, 0.8, 0.3, 1); }
  .card { border-radius: 24px; padding: 18px 18px 14px; margin-bottom: 12px; animation: rise 0.4s cubic-bezier(0.2, 0.8, 0.3, 1) both; }
  .cardTitle { font-size: 13px; font-weight: 800; margin-bottom: 8px; }
  .cardHint { font-size: 13px; color: #84848C; font-weight: 600; margin: -4px 0 8px; }
  .item { display: flex; align-items: center; gap: 14px; padding: 13px 0; cursor: pointer; transition: transform 0.12s ease; }
  .item:active { transform: scale(0.98); }
  .item + .item { border-top: 1px solid rgba(255,255,255,0.06); }
  .box { width: 26px; height: 26px; flex: none; border-radius: 9px; border: 2px solid rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900; color: #0D0E11; transition: background 0.15s ease, border-color 0.15s ease; }
  .item.on .box { border-color: transparent; animation: pop 0.28s cubic-bezier(0.34, 1.5, 0.5, 1); }
  .txt { font-size: 17px; font-weight: 700; line-height: 1.3; letter-spacing: -0.2px; flex: 1; }
  .item.done .txt { text-decoration: line-through; opacity: 0.45; }
  .del { color: #84848C; font-size: 20px; font-weight: 800; padding: 0 4px; }
  .empty { color: #84848C; font-size: 15px; font-weight: 600; text-align: center; padding: 20px 10px; line-height: 1.5; }
  .addrow { display: flex; gap: 10px; margin-top: 4px; }
  .addrow input {
    flex: 1; min-width: 0; background: #0D0E11; border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; color: #F5F5F7;
    font: inherit; font-size: 16px; font-weight: 600; padding: 13px 14px; outline: none; -webkit-user-select: text; user-select: text;
  }
  .addrow button { background: #FBBF24; color: #0D0E11; border: 0; border-radius: 14px; font: inherit; font-size: 15px; font-weight: 800; padding: 0 18px; }
  .addrow button:active { transform: scale(0.95); }
  .fab {
    position: fixed; left: 18px; right: 18px; bottom: calc(env(safe-area-inset-bottom) + 22px);
    max-width: 460px; margin: 0 auto; border-radius: 18px; padding: 18px; text-align: center;
    font-size: 17px; font-weight: 800; color: #fff; cursor: pointer; box-shadow: 0 14px 38px -14px rgba(0,0,0,0.8);
    transition: transform 0.12s ease;
  }
  .fab:active { transform: scale(0.97); }
  @keyframes heroPop { 0% { opacity: 0; transform: scale(0.86) translateY(14px); } 60% { opacity: 1; transform: scale(1.02) translateY(-2px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
  @keyframes rise { 0% { opacity: 0; transform: translateY(24px); } 100% { opacity: 1; transform: translateY(0); } }
  @keyframes iconBounce { 0% { transform: scale(0.3) rotate(-12deg); opacity: 0; } 55% { transform: scale(1.18) rotate(4deg); opacity: 1; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
  @keyframes gridIn { 0% { opacity: 0; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes pop { 0% { transform: scale(0.6); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .tile, .hero, .heroIcon, .card, .box { animation: none; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const BETWEEN = [
  "Clean room and do laundry",
  "Schedule out my day",
  "Push-ups (toward 50 straight)",
  "Quick five-minute walk",
  "Box jump work (toward 48 in)",
  "Speed work",
  "Edit and post a reel from hangout footage",
  "No sugar",
  "Audiobook or podcast on any drive",
];
const DAYS = [
  { id: "school", name: "School Day", icon: "📚", g: ["#60A5FA", "#2563EB"], accent: "#60A5FA",
    framework: ["Seminary", "All school assignments done", "Football practice", "Email checked", "Texts checked (coaching and BMD clients)"],
    extrasTitle: "In between assignments (while videos play)",
    extras: BETWEEN },
  { id: "coaching", name: "Coaching Day", icon: "🎯", g: ["#34D399", "#059669"], accent: "#34D399",
    framework: ["Seminary", "2 to 3 coaching calls stacked in the morning", "All school assignments done", "Football practice", "Email checked", "Texts checked (coaching and BMD clients)"],
    extrasTitle: "Between calls (while videos play)",
    extras: BETWEEN },
  { id: "hangout", name: "Hangout Day", icon: "🤙", g: ["#FB7185", "#E11D48"], accent: "#FB7185",
    framework: ["Seminary", "Film whatever we do for reels"],
    extrasTitle: "What are we doing",
    extras: [
      "Hang out at my house", "Hang out at the office", "Trampoline park (back full practice)", "Drive around",
      "Go on a hike", "Go to the park", "Go to the rock shop", "Go shopping", "Get food", "Play games",
      "Cold plunge or hot tub", "Axe throwing", "Cook something together", "Go to the temple", "Surron rides", "No sugar",
    ] },
];
const GOALS = { name: "Season Goals", icon: "🏈", g: ["#FBBF24", "#D97706"], accent: "#FBBF24",
  items: [
    "No sugar (all season)", "Learn a back full on the trampoline", "50 push-ups in a row", "48 inch box jump",
    "Get to 190 lbs", "Speed work: get quicker", "Make Instagram reels", "Surron rides",
    "Learn from books (audiobooks and podcasts on drives)", "Always active, moving, doing fun stuff, getting better, learning",
  ] };
const TODAY = { name: "Today", icon: "☀️", g: ["#A78BFA", "#7C3AED"], accent: "#A78BFA" };

const app = document.getElementById("app");
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); }
function lget(k, fb) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : fb; } catch { return fb; } }
function lset(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function getList() { return lget("days:today", null); }
function setList(l) { lset("days:today", l); }
function dateLabel() { return new Date().toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" }); }
function grad(g, deg = 145) { return `background:linear-gradient(${deg}deg, ${g[0]}, ${g[1]}); box-shadow:0 8px 24px -12px ${g[1]}66;`; }
function cardStyle(acc, delay) { return `animation-delay:${delay}s; background:linear-gradient(180deg, ${acc}1F, ${acc}0A), #17181C; border:1px solid ${acc}33;`; }
function hero(d, countText, pct) {
  return `
    <div class="hero" style="background:linear-gradient(155deg, ${d.g[0]}, ${d.g[1]}); box-shadow:0 14px 38px -14px ${d.g[1]}99;">
      <div class="heroTop"><div class="heroName">${esc(d.name)}</div><span class="heroIcon">${d.icon}</span></div>
      <div class="heroCount" id="hc">${countText}</div>
      ${pct === null ? "" : `<div class="heroBar"><div class="heroFill" id="hf" style="width:${pct}%"></div></div>`}
    </div>`;
}
function itemRow(text, on, acc, extra = "") {
  return `<div class="item ${on ? "on" : ""}" data-item="${esc(text)}" ${extra}>
    <div class="box" style="${on ? `background:${acc}` : ""}">${on ? "✓" : ""}</div>
    <div class="txt">${esc(text)}</div></div>`;
}
function toggleRow(el, on, acc) {
  el.classList.toggle("on", on);
  const box = el.querySelector(".box"); box.style.background = on ? acc : ""; box.textContent = on ? "✓" : "";
}

// Screen 1: open the app
function renderHome() {
  const list = getList();
  if (list) return renderToday();
  app.innerHTML = `
    <div class="apptitle">Days<span>.</span></div>
    <div class="sub">${esc(dateLabel())}</div>
    <div class="grid">
      <div class="tile wide big" id="create" style="animation-delay:0s; ${grad(TODAY.g)}">
        <div class="ticon">${TODAY.icon}</div>
        <div><div class="tname">Create a list for today</div><div class="tsub">Pick a day type, then pick what you're doing</div></div>
      </div>
      <div class="tile wide" id="goalsTile" style="animation-delay:0.06s; min-height:104px; ${grad(GOALS.g)}">
        <div class="ticon">${GOALS.icon}</div>
        <div class="tname">${GOALS.name}</div>
      </div>
    </div>`;
  document.getElementById("create").addEventListener("click", renderChoose);
  document.getElementById("goalsTile").addEventListener("click", renderGoals);
  window.scrollTo(0, 0);
}

// Screen 2: the three day types
function renderChoose() {
  app.innerHTML = `
    <div class="topbar"><div class="back" id="back">‹ Back</div></div>
    <div class="apptitle">What kind of day?</div>
    <div class="sub">${esc(dateLabel())}</div>
    <div class="grid">
      ${DAYS.map((d, i) => `
        <div class="tile ${i === 2 ? "wide" : ""}" data-i="${i}" style="animation-delay:${i * 0.05}s; ${i === 2 ? "min-height:104px;" : ""} ${grad(d.g)}">
          <div class="ticon">${d.icon}</div>
          <div class="tname">${esc(d.name)}</div>
        </div>`).join("")}
    </div>`;
  document.getElementById("back").addEventListener("click", renderHome);
  app.querySelectorAll(".tile[data-i]").forEach(el => el.addEventListener("click", () => renderBuild(Number(el.dataset.i))));
  window.scrollTo(0, 0);
}

// Screen 3: framework (pre-checked), extras (pick), manual adds
function renderBuild(i) {
  const d = DAYS[i];
  const sel = new Set(d.framework);
  const manual = [];
  function draw() {
    app.innerHTML = `
      <div class="topbar"><div class="back" id="back">‹ Back</div></div>
      ${hero(d, `${sel.size + manual.length} on the list`, null)}
      <div class="card" style="${cardStyle(d.accent, 0.1)}">
        <div class="cardTitle" style="color:${d.accent}">The framework</div>
        <div class="cardHint">Already on the list. Tap to drop one.</div>
        ${d.framework.map(it => itemRow(it, sel.has(it), d.accent)).join("")}
      </div>
      <div class="card" style="${cardStyle(d.accent, 0.16)}">
        <div class="cardTitle" style="color:${d.accent}">${esc(d.extrasTitle)}</div>
        <div class="cardHint">Tap anything else you want to get done.</div>
        ${d.extras.map(it => itemRow(it, sel.has(it), d.accent)).join("")}
      </div>
      <div class="card" style="animation-delay:0.22s; background:#17181C; border:1px solid rgba(255,255,255,0.08);">
        <div class="cardTitle" style="color:${d.accent}">Anything else</div>
        ${manual.map((it, idx) => `<div class="item on" data-manual="${idx}"><div class="box" style="background:${d.accent}">✓</div><div class="txt">${esc(it)}</div><div class="del">×</div></div>`).join("")}
        <div class="addrow"><input id="newItem" placeholder="Type an item" autocomplete="off"><button id="add">Add</button></div>
      </div>
      <div class="fab" id="build" style="${grad(d.g)}">Create my list</div>`;
    document.getElementById("back").addEventListener("click", renderChoose);
    app.querySelectorAll(".item[data-item]").forEach(el => {
      el.addEventListener("click", () => {
        const k = el.dataset.item; const on = !sel.has(k);
        on ? sel.add(k) : sel.delete(k);
        toggleRow(el, on, d.accent);
        document.getElementById("hc").textContent = `${sel.size + manual.length} on the list`;
      });
    });
    app.querySelectorAll(".item[data-manual]").forEach(el => {
      el.addEventListener("click", () => { manual.splice(Number(el.dataset.manual), 1); draw(); });
    });
    const input = document.getElementById("newItem");
    function add() { const t = input.value.trim(); if (!t) return; manual.push(t); draw(); setTimeout(() => document.getElementById("newItem")?.focus(), 50); }
    document.getElementById("add").addEventListener("click", add);
    input.addEventListener("keydown", e => { if (e.key === "Enter") add(); });
    document.getElementById("build").addEventListener("click", () => {
      const ordered = [...d.framework, ...d.extras].filter(it => sel.has(it));
      setList({ day: d.id, date: dateLabel(), items: [...ordered, ...manual].map(text => ({ text, done: false })) });
      renderToday();
    });
  }
  draw();
  window.scrollTo(0, 0);
}

// Screen 4: today's list
function renderToday() {
  const list = getList();
  if (!list) return renderHome();
  const d = DAYS.find(x => x.id === list.day) || TODAY;
  const acc = d.accent;
  const done = list.items.filter(i => i.done).length;
  const pct = list.items.length ? Math.round(done / list.items.length * 100) : 0;
  app.innerHTML = `
    <div class="topbar"><div class="pills"><div class="pill" id="goals">Goals</div></div><div class="pill" id="reset">Reset list</div></div>
    ${hero({ name: `Today: ${d.name}`, icon: d.icon, g: d.g }, `${done} of ${list.items.length} done`, pct)}
    <div class="card" style="${cardStyle(acc, 0.1)}">
      ${list.items.length ? list.items.map((it, idx) => `
        <div class="item ${it.done ? "on done" : ""}" data-idx="${idx}">
          <div class="box" style="${it.done ? `background:${acc}` : ""}">${it.done ? "✓" : ""}</div>
          <div class="txt">${esc(it.text)}</div>
          <div class="del" data-del="${idx}">×</div>
        </div>`).join("")
      : `<div class="empty">List is empty. Add something below or reset to start over.</div>`}
    </div>
    <div class="card" style="animation-delay:0.16s; background:#17181C; border:1px solid rgba(255,255,255,0.08);">
      <div class="cardTitle" style="color:${acc}">Add something</div>
      <div class="addrow"><input id="newItem" placeholder="Type an item" autocomplete="off"><button id="add">Add</button></div>
    </div>`;
  document.getElementById("goals").addEventListener("click", renderGoals);
  document.getElementById("reset").addEventListener("click", () => {
    if (confirm("Are you sure you want to do this? You will lose any changes you have made.")) { setList(null); localStorage.removeItem("days:today"); renderHome(); }
  });
  app.querySelectorAll(".item").forEach(el => {
    el.addEventListener("click", (e) => {
      const l = getList();
      if (e.target.dataset.del !== undefined) {
        if (!confirm("Remove this from today's list?")) return;
        l.items.splice(Number(e.target.dataset.del), 1); setList(l); renderToday(); return;
      }
      const it = l.items[Number(el.dataset.idx)]; it.done = !it.done; setList(l);
      toggleRow(el, it.done, acc); el.classList.toggle("done", it.done);
      const nd = l.items.filter(i => i.done).length;
      document.getElementById("hc").textContent = `${nd} of ${l.items.length} done`;
      document.getElementById("hf").style.width = `${l.items.length ? Math.round(nd / l.items.length * 100) : 0}%`;
    });
  });
  const input = document.getElementById("newItem");
  function add() { const t = input.value.trim(); if (!t) return; const l = getList(); l.items.push({ text: t, done: false }); setList(l); renderToday(); setTimeout(() => document.getElementById("newItem")?.focus(), 50); }
  document.getElementById("add").addEventListener("click", add);
  input.addEventListener("keydown", e => { if (e.key === "Enter") add(); });
  window.scrollTo(0, 0);
}

// Goals
function renderGoals() {
  const d = GOALS; const st = lget("days:goals", {});
  const done = d.items.filter(i => st[i]).length;
  app.innerHTML = `
    <div class="topbar"><div class="back" id="back">‹ Back</div><div class="pill" id="reset">Reset</div></div>
    ${hero(d, `${done} of ${d.items.length} done`, Math.round(done / d.items.length * 100))}
    <div class="card" style="${cardStyle(d.accent, 0.1)}">
      <div class="cardTitle" style="color:${d.accent}">Check off when it's done for good</div>
      ${d.items.map(it => `<div class="item ${st[it] ? "on done" : ""}" data-item="${esc(it)}"><div class="box" style="${st[it] ? `background:${d.accent}` : ""}">${st[it] ? "✓" : ""}</div><div class="txt">${esc(it)}</div></div>`).join("")}
    </div>`;
  document.getElementById("back").addEventListener("click", renderHome);
  document.getElementById("reset").addEventListener("click", () => { lset("days:goals", {}); renderGoals(); });
  app.querySelectorAll(".item").forEach(el => {
    el.addEventListener("click", () => {
      const s = lget("days:goals", {}); const k = el.dataset.item; s[k] = !s[k]; lset("days:goals", s);
      toggleRow(el, !!s[k], d.accent); el.classList.toggle("done", !!s[k]);
      const nd = d.items.filter(i => s[i]).length;
      document.getElementById("hc").textContent = `${nd} of ${d.items.length} done`;
      document.getElementById("hf").style.width = `${Math.round(nd / d.items.length * 100)}%`;
    });
  });
  window.scrollTo(0, 0);
}

renderHome();
</script>
</body>
</html>
