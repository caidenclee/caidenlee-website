<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F2L Video Library — Caiden Lee</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a0f;
      --surface:   #111118;
      --border:    rgba(255,255,255,0.07);
      --text:      #e8e8f0;
      --muted:     #5a5a6a;
      --accent:    #7c3aed;
      --beginner:  #22c55e;
      --intermediate: #eab308;
      --advanced:  #3b82f6;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .page-header {
      padding: 56px 24px 0;
      max-width: 900px;
      margin: 0 auto;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .page-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text);
      margin-bottom: 8px;
    }

    .page-subtitle {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 36px;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 32px;
    }

    .tab-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 12px 20px 11px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: color 0.15s;
      margin-bottom: -1px;
    }

    .tab-btn:hover { color: var(--text); }

    .tab-btn.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }

    .tab-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 20px;
      background: rgba(255,255,255,0.06);
      color: var(--muted);
    }

    .tab-btn.active .tab-badge {
      background: rgba(124,58,237,0.2);
      color: #a78bfa;
    }

    /* ── Tab panels ── */
    .tab-panel { display: none; animation: fadeIn 0.2s ease; }
    .tab-panel.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .empty-state {
      text-align: center;
      padding: 64px 24px;
      color: var(--muted);
      font-size: 14px;
    }

    /* ── Grid ── */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    /* ── Card ── */
    .video-card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: border-color 0.15s, transform 0.12s;
    }

    .video-card:hover {
      border-color: rgba(124,58,237,0.4);
      transform: translateY(-2px);
    }

    .video-card:active { transform: translateY(0); }

    .thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #1a1a24;
      overflow: hidden;
    }

    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .duration-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      backdrop-filter: blur(4px);
    }

    .progress-dots {
      position: absolute;
      bottom: 8px;
      left: 8px;
      display: flex;
      gap: 4px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.5);
      background: transparent;
      transition: background 0.2s;
    }

    .dot.filled { background: #fff; border-color: #fff; }

    .card-body { padding: 13px 14px 14px; }

    .difficulty-pill {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 20px;
      margin-bottom: 7px;
    }

    .pill-beginner     { background: rgba(34,197,94,0.12);  color: #22c55e; }
    .pill-intermediate { background: rgba(234,179,8,0.12);  color: #eab308; }
    .pill-advanced     { background: rgba(59,130,246,0.12); color: #3b82f6; }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.45;
      color: var(--text);
    }

    /* ── Content wrapper ── */
    .content {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }
  </style>
</head>
<body>

  <div class="page-header">
    <p class="eyebrow">Resources</p>
    <h1 class="page-title">F2L Video Library</h1>
    <p class="page-subtitle">Step-by-step video breakdowns for every F2L case category.</p>
  </div>

  <div class="content">
    <div class="tabs" id="tabs"></div>
    <div id="panels"></div>
  </div>

  <script>
    const videos = [
      {
        id: 'bJiPHMW8mmw',
        title: '5 Beginner F2L Cases (Both Pieces In Top)',
        duration: '0:00',
        difficulty: 'beginner',
        slug: 'beginner-both-pieces-top'
      },
      {
        id: 'FnnEW2jaZyQ',
        title: '5 Intermediate F2L Cases (Pieces in the Top Touching)',
        duration: '0:00',
        difficulty: 'intermediate',
        slug: 'intermediate-top-touching'
      },
      {
        id: 'SHtI0C5LHkY',
        title: '4 Intermediate F2L Cases (Edge In Slot)',
        duration: '0:00',
        difficulty: 'intermediate',
        slug: 'intermediate-edge-in-slot'
      },
      {
        id: 'j6QQfTSCgb8',
        title: '3 Intermediate F2L Cases (Corner In Slot)',
        duration: '0:00',
        difficulty: 'intermediate',
        slug: 'intermediate-corner-in-slot'
      }
    ];

    const DIFFICULTIES = ['beginner', 'intermediate', 'advanced'];
    const LABELS = { beginner: 'Beginner', intermediate: 'Intermediate', advanced: 'Advanced' };

    function getProgress(slug) {
      try {
        return JSON.parse(localStorage.getItem('f2l-progress-' + slug)) || {};
      } catch { return {}; }
    }

    function countProgress(p) {
      return ['watched','practiced','mastered'].filter(k => p[k]).length;
    }

    function buildCard(v) {
      const p = getProgress(v.slug);
      const steps = ['watched','practiced','mastered'];
      const dots = steps.map(k =>
        `<div class="dot ${p[k] ? 'filled' : ''}"></div>`
      ).join('');

      return `
        <a class="video-card" href="/F2L/${v.slug}/">
          <div class="thumb-wrap">
            <img src="https://img.youtube.com/vi/${v.id}/mqdefault.jpg" alt="${v.title}" loading="lazy">
            <span class="duration-badge">${v.duration}</span>
            <div class="progress-dots">${dots}</div>
          </div>
          <div class="card-body">
            <span class="difficulty-pill pill-${v.difficulty}">${LABELS[v.difficulty]}</span>
            <p class="card-title">${v.title}</p>
          </div>
        </a>`;
    }

    function render() {
      const tabsEl = document.getElementById('tabs');
      const panelsEl = document.getElementById('panels');

      DIFFICULTIES.forEach((diff, i) => {
        const group = videos.filter(v => v.difficulty === diff);
        const count = group.length;

        // Tab button
        const btn = document.createElement('button');
        btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
        btn.dataset.tab = diff;
        btn.innerHTML = `${LABELS[diff]} <span class="tab-badge">${count}</span>`;
        btn.addEventListener('click', () => switchTab(diff));
        tabsEl.appendChild(btn);

        // Panel
        const panel = document.createElement('div');
        panel.className = 'tab-panel' + (i === 0 ? ' active' : '');
        panel.id = 'panel-' + diff;

        if (count === 0) {
          panel.innerHTML = `<div class="empty-state">No ${LABELS[diff].toLowerCase()} videos yet.</div>`;
        } else {
          panel.innerHTML = `<div class="video-grid">${group.map(buildCard).join('')}</div>`;
        }
        panelsEl.appendChild(panel);
      });
    }

    function switchTab(diff) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === diff));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + diff));
    }

    render();
  </script>
</body>
</html>
