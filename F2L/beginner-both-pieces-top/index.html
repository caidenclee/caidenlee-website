<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5 Beginner F2L Cases (Both Pieces In Top) — Caiden Lee</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --surface: #111118; --border: rgba(255,255,255,0.07);
      --text: #e8e8f0; --muted: #5a5a6a; --accent: #7c3aed;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; -webkit-font-smoothing: antialiased; }

    /* Nav */
    nav {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; height: 52px;
      background: rgba(10,10,15,0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo { font-size: 15px; font-weight: 800; color: var(--text); text-decoration: none; letter-spacing: -0.02em; }
    .back-link { font-size: 13px; font-weight: 500; color: var(--muted); text-decoration: none; display: flex; align-items: center; gap: 5px; transition: color 0.15s; }
    .back-link:hover { color: var(--text); }

    /* Content */
    .content { max-width: 760px; margin: 0 auto; padding: 36px 24px 80px; }

    .breadcrumb { font-size: 12px; color: var(--muted); margin-bottom: 24px; }
    .breadcrumb a { color: var(--muted); text-decoration: none; }
    .breadcrumb a:hover { color: var(--text); }
    .breadcrumb span { margin: 0 6px; }

    /* Embed */
    .embed-wrap { position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 14px; overflow: hidden; background: #0d0d14; margin-bottom: 20px; }
    .embed-wrap iframe { width: 100%; height: 100%; border: none; display: block; }
    .video-overlay { position: absolute; inset: 0; z-index: 1; pointer-events: none; background: transparent; }

    /* Video meta */
    .video-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .difficulty-pill {
      display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 3px 9px; border-radius: 20px;
      background: rgba(34,197,94,0.12); color: #22c55e;
    }
    .video-title { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 28px; line-height: 1.3; }

    /* Checklist card */
    .checklist-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 16px;
    }
    .checklist-header { padding: 16px 20px 14px; border-bottom: 1px solid var(--border); }
    .checklist-header h2 { font-size: 13px; font-weight: 700; color: var(--text); letter-spacing: 0.01em; }
    .checklist-header p { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .checklist-step {
      display: flex; align-items: center; gap: 14px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    .checklist-step:last-child { border-bottom: none; }
    .checklist-step:hover { background: rgba(255,255,255,0.02); }

    .step-checkbox {
      flex-shrink: 0; width: 22px; height: 22px; border-radius: 6px;
      border: 1.5px solid rgba(255,255,255,0.15); background: transparent;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }
    .step-checkbox.checked { background: var(--accent); border-color: var(--accent); }
    .step-checkbox svg { display: none; }
    .step-checkbox.checked svg { display: block; }

    .step-info { flex: 1; }
    .step-label { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
    .step-desc { font-size: 12px; color: var(--muted); }

    .step-badge {
      flex-shrink: 0; font-size: 10px; font-weight: 700; color: var(--muted);
      background: rgba(255,255,255,0.05); border-radius: 20px; padding: 3px 9px;
    }

    /* Progress bar */
    .progress-wrap { padding: 0 20px 20px; }
    .progress-label { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
    .progress-bar { height: 4px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.3s ease; }
  </style>
</head>
<body>

  <nav>
    <a class="nav-logo" href="/F2L/">Caiden Lee</a>
  </nav>

  <div class="content">
    <p class="breadcrumb"><a href="/F2L/">F2L Library</a><span>›</span> Beginner</p>

    <div class="embed-wrap">
      <iframe src="https://www.youtube.com/embed/bJiPHMW8mmw?rel=0&modestbranding=1&autoplay=1" allow="autoplay; fullscreen" allowfullscreen></iframe>
      <div class="video-overlay" id="video-overlay"></div>
    </div>

    <div class="video-meta">
      <span class="difficulty-pill">Beginner</span>
    </div>
    <h1 class="video-title">5 Beginner F2L Cases (Both Pieces In Top)</h1>

    <div class="checklist-card">
      <div class="checklist-header">
        <h2>Your Progress</h2>
      </div>

      <div class="checklist-step" data-key="watched">
        <div class="step-checkbox" id="cb-watched">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6.5l3 3 5-5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="step-info">
          <p class="step-label">Watched</p>
        </div>
        <span class="step-badge">Step 1</span>
      </div>

      <div class="checklist-step" data-key="practiced">
        <div class="step-checkbox" id="cb-practiced">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6.5l3 3 5-5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="step-info">
          <p class="step-label">Practiced</p>
        </div>
        <span class="step-badge">Step 2</span>
      </div>

      <div class="checklist-step" data-key="mastered">
        <div class="step-checkbox" id="cb-mastered">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6.5l3 3 5-5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="step-info">
          <p class="step-label">Mastered</p>
        </div>
        <span class="step-badge">Step 3</span>
      </div>

      <div class="progress-wrap">
        <p class="progress-label" id="progress-label">0 / 3 complete</p>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      </div>
    </div>
  </div>

  <script>
    const wrap = document.querySelector('.embed-wrap');
    const overlay = document.getElementById('video-overlay');
    wrap.addEventListener('mouseenter', () => { overlay.style.pointerEvents = 'none'; });
    wrap.addEventListener('mouseleave', () => { overlay.style.pointerEvents = 'auto'; });
  </script>
  <script>
    const SLUG = 'beginner-both-pieces-top';
    const KEY = 'f2l-progress-' + SLUG;
    const STEPS = ['watched', 'practiced', 'mastered'];

    function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } }
    function save(p) { localStorage.setItem(KEY, JSON.stringify(p)); }

    function render(p) {
      const count = STEPS.filter(k => p[k]).length;
      STEPS.forEach(k => {
        const cb = document.getElementById('cb-' + k);
        cb.classList.toggle('checked', !!p[k]);
      });
      document.getElementById('progress-label').textContent = count + ' / 3 complete';
      document.getElementById('progress-fill').style.width = (count / 3 * 100) + '%';
    }

    let progress = load();
    render(progress);

    document.querySelectorAll('.checklist-step').forEach(row => {
      row.addEventListener('click', () => {
        const k = row.dataset.key;
        progress[k] = !progress[k];
        save(progress);
        render(progress);
      });
    });
  </script>
</body>
</html>
